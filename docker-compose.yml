name: playful-programming-terraform-demo

# Floci — free, MIT-licensed local AWS emulator.
# Replaces LocalStack, whose Community edition sunset in March 2026.
#
# The Docker socket mount is required: Floci backs RDS with real Postgres
# containers and ECS with real task containers, rather than mocking them.
services:
  floci:
    image: floci/floci:latest
    container_name: playful-programming-floci
    ports:
      - "4566:4566"
      # Floci proxies spawned RDS containers on 7001+. Published so `psql` works
      # from the host, not just from inside the Compose network.
      # Starts at 7001, not 7000: macOS AirPlay Receiver binds 7000.
      - "7001-7010:7001-7010"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.floci-data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      # Stack 4: CloudFront refuses custom origins that resolve to loopback
      # (SSRF protection), and a Floci function URL resolves to exactly that.
      # Exact hosts only, no wildcards. This is the URL host of the Lambda named
      # `sacjs-tanstack`; Floci derives it from the function name, so renaming
      # that function means updating this line from
      # `terraform output function_url_host` in stacks/04-tanstack/terraform.
      FLOCI_SERVICES_CLOUDFRONT_ALLOWED_PRIVATE_ORIGIN_HOSTS: 050b8be3312839158f6a6c6054306329.lambda-url.us-east-1.localhost
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_floci/health || curl -sf http://localhost:4566/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
